<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>سؤال مهم جدًا</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/typed.js@2.0.12"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      min-height: 100vh;
      background: #000000;
      color: #a0d8ef;
      font-family: 'Cairo', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      overflow-x: hidden;
    }
    .container { max-width: 90%; width: 100%; max-width: 640px; }
    h1, .typing-text { font-size: clamp(1.6rem, 6vw, 2.4rem); line-height: 1.4; margin-bottom: 1.5rem; }
    p, button { font-size: clamp(1.1rem, 4.5vw, 1.35rem); line-height: 1.6; }
    button {
      font-family: 'Cairo', sans-serif;
      font-weight: 500;
      padding: 14px 32px;
      margin: 12px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.25s ease;
      font-size: clamp(1.05rem, 4vw, 1.25rem);
      min-width: 140px;
      touch-action: manipulation;
    }
    .btn-yes { background: #98fb98; color: #000; }
    .btn-yes:hover { background: #7fff00; transform: translateY(-2px); }
    .btn-no { background: #444; color: #e0e0e0; }
    .btn-no:hover { background: #555; }
    .btn-retry, .btn-final-no { background: #333; color: white; }
    .btn-retry:hover { background: #555; }
    .btn-final-no:hover { background: #c0392b; }
    #intro, #questions-section, #video-section, #date-section, #final-section, #final-no-section { display: none; }
    #typing { display: inline-block; white-space: pre-wrap; }
    video {
      width: 100%;
      max-width: 520px;
      border-radius: 16px;
      margin: 20px 0;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
    }
    #date-picker {
      font-size: 1.2rem;
      padding: 12px;
      margin: 20px 0;
      border-radius: 10px;
      border: 1px solid #555;
      background: #111;
      color: #a0d8ef;
      width: 100%;
      max-width: 320px;
    }
    .hidden { display: none !important; }
    @media (max-width: 500px) {
      button { padding: 12px 24px; margin: 10px 6px; min-width: 120px; }
    }
  </style>
</head>
<body>

<div class="container">

  <div id="intro">
    <div id="typing" class="typing-text"></div>
  </div>

  <div id="questions-section">
    <p id="question-text"></p>
    
    <div id="answer-buttons">
      <button class="btn-yes" id="btn-yes"></button>
      <button class="btn-no" id="btn-no"></button>
    </div>

    <div id="retry-buttons" class="hidden">
      <button class="btn-retry" id="btn-retry">إعادة المحاولة</button>
      <button class="btn-final-no" id="btn-final-no">لا، هذا كل شيء</button>
    </div>
  </div>

  <div id="video-section">
    <p style="margin-bottom: 1rem;">شوفي الفيديو ده لحظة...</p>
    <video id="proposal-video" autoplay muted playsinline>
      <source src="video.mp4" type="video/mp4">
      المتصفح لا يدعم تشغيل الفيديو
    </video>
  </div>

  <div id="date-section">
    <p>متى نشوف اليوم ده يا قلبي؟</p>
    <input type="date" id="date-picker" required>
    <br>
    <button class="btn-yes" id="btn-date-submit">إرسال</button>
  </div>

  <!-- Final message when YES on last question + date submitted -->
  <div id="final-section">
    <h1 style="color: #98fb98; margin-bottom: 1.5rem;">ياااه يا حبيبتي! ♥</h1>
    <p style="font-size: 1.4rem; line-height: 1.7;">
      تم إرسال إجاباتك وتاريخ الفرحة...<br>
      استنيني شوية... فيه مفاجأة كبيرة جاية ليكي قريب جدًا 😍
    </p>
  </div>

  <!-- Different final message when she clicks "لا، هذا كل شيء" -->
  <div id="final-no-section">
    <h1 style="color: #f8c471; margin-bottom: 1.5rem;">تمام يا قلبي ♥</h1>
    <p style="font-size: 1.3rem; line-height: 1.7;">
      شكرًا إنك رديتي بصراحة...<br>
      بحبك جدًا، ومهما كانت إجابتك<br>
      هفضل جنبك وأحترم قرارك دايمًا.<br><br>
      أنتِ أغلى حاجة عندي دايمًا.
    </p>
  </div>

</div>

<audio id="celebration-sound" src="yes.mp3"></audio>

<script>
  const formspreeUrl = 'https://formspree.io/f/xpqlvlaa';

  const questions = [
    { q: "هل تتذكرين يوم لقائنا الأول؟", yes: "أكيد!", no: "مش واضح" },
    { q: "هل حبيتي الورد اللي جبتهولك؟", yes: "أوي جدًا", no: "عادي" },
    { q: "جاهزة للمغامرة الجاية معايا؟", yes: "مستعدة!", no: "لسه" },
    { q: "عجبتك الرسالة دي؟", yes: "جميلة جدًا", no: "مش قوية" },
    { q: "هل تتزوجيني ونكمل الحياة مع بعض؟", yes: "نعم!", no: "لأ" }
  ];

  let currentIdx = 0;
  let answers = [];

  // Elements
  const introEl        = document.getElementById('intro');
  const questionsEl    = document.getElementById('questions-section');
  const videoSection   = document.getElementById('video-section');
  const dateSection    = document.getElementById('date-section');
  const finalSection   = document.getElementById('final-section');
  const finalNoSection = document.getElementById('final-no-section');

  const questionText   = document.getElementById('question-text');
  const answerButtons  = document.getElementById('answer-buttons');
  const btnYes         = document.getElementById('btn-yes');
  const btnNo          = document.getElementById('btn-no');
  const retryButtons   = document.getElementById('retry-buttons');
  const btnRetry       = document.getElementById('btn-retry');
  const btnFinalNo     = document.getElementById('btn-final-no');
  const video          = document.getElementById('proposal-video');
  const datePicker     = document.getElementById('date-picker');
  const btnDateSubmit  = document.getElementById('btn-date-submit');
  const celebration    = document.getElementById('celebration-sound');

  introEl.style.display = 'block';
  new Typed('#typing', {
    strings: [
      'يا أغلى الناس عندي...',
      'عندي سؤال مهم جدًا النهاردة',
      'هتسمعيني؟'
    ],
    typeSpeed: 60,
    backSpeed: 40,
    loop: false,
    onComplete: () => {
      setTimeout(() => {
        introEl.style.display = 'none';
        showQuestion(0);
      }, 1200);
    }
  });

  function showQuestion(idx) {
    currentIdx = idx;
    const q = questions[idx];
    questionText.textContent = q.q;
    btnYes.textContent = q.yes;
    btnNo.textContent  = q.no;

    questionsEl.style.display = 'block';
    answerButtons.style.display = 'flex';
    retryButtons.classList.add('hidden');
  }

  btnYes.onclick = () => {
    answers.push({ question: questions[currentIdx].q, answer: "نعم" });
    nextStep();
  };

  btnNo.onclick = () => {
    answers.push({ question: questions[currentIdx].q, answer: "لا" });
    answerButtons.style.display = 'none';
    retryButtons.classList.remove('hidden');
  };

  btnRetry.onclick = () => {
    retryButtons.classList.add('hidden');
    answerButtons.style.display = 'flex';
  };

  btnFinalNo.onclick = () => {
    sendEmail(null, 'no');
  };

  function nextStep() {
    if (currentIdx === questions.length - 1) {
      celebrate();
      questionsEl.style.display = 'none';
      dateSection.style.display = 'block';
    } else if (currentIdx === 2) {
      questionsEl.style.display = 'none';
      videoSection.style.display = 'block';
      video.play().catch(() => console.log("Autoplay was blocked"));
    } else {
      currentIdx++;
      showQuestion(currentIdx);
    }
  }

  video.addEventListener('ended', () => {
    videoSection.style.display = 'none';
    currentIdx++;
    showQuestion(currentIdx);
  });

  btnDateSubmit.onclick = () => {
    const dateVal = datePicker.value;
    if (!dateVal) {
      alert("اختاري تاريخ لو سمحتي ♥");
      return;
    }
    sendEmail(dateVal, 'yes');
  };

  function celebrate() {
    confetti({
      particleCount: 120,
      spread: 80,
      origin: { y: 0.6 }
    });
    celebration.play().catch(() => {});
  }

  function sendEmail(selectedDate, finalType) {
    const message = answers
      .map((item, i) => `${i+1}. ${item.question}\n   → ${item.answer}`)
      .join('\n\n');

    const body = {
      answers: message,
      wedding_date: selectedDate || 'غير محدد',
      final_choice: finalType === 'yes' ? 'وافقت واختارت تاريخ' : 'قالت لا في اللحظة دي',
      _subject: 'اقتراح زواج - ' + (finalType === 'yes' ? 'نعم!' : 'رد مبدئي')
    };

    fetch(formspreeUrl, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Accept': 'application/json'
      },
      body: JSON.stringify(body)
    })
    .then(response => {
      if (response.ok) {
        dateSection.style.display = 'none';
        questionsEl.style.display = 'none';
        videoSection.style.display = 'none';

        if (finalType === 'yes') {
          finalSection.style.display = 'block';
        } else {
          finalNoSection.style.display = 'block';
        }
      } else {
        alert("حصل خطأ في الإرسال... جربي تاني");
      }
    })
    .catch(err => {
      console.error(err);
      alert("فيه مشكلة في الشبكة");
    });
  }
</script>

</body>
</html>
